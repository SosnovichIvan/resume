name: Deploy release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: resume-production-deploy
  cancel-in-progress: false

jobs:
  checks:
    name: Site checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: bash -n deploy.sh
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 120
      - name: Verify container responses
        run: |
          curl --fail http://127.0.0.1:3000/ > /dev/null
          curl --fail http://127.0.0.1:3000/avatar.jpg > /dev/null
      - name: Logs
        if: failure()
        run: docker compose logs --tail=100
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - run: docker compose down
        if: always()

  verify-release-source:
    name: Verify tag is from main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tagged commit belongs to main
        run: |
          git fetch origin main --tags --force
          tag_commit="$(git rev-list -n 1 "${GITHUB_REF}")"
          git merge-base --is-ancestor "${tag_commit}" "origin/main"

  deploy:
    name: Deploy to VPS
    needs: [checks, verify-release-source]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Deploy tagged release over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script_stop: true
          script: |
            set -eu
            release_dir="/tmp/resume-release-${{ github.run_id }}"
            config_file="/tmp/resume-deploy-${{ github.run_id }}.config"
            trap 'rm -rf "${release_dir}" "${config_file}"' EXIT
            git clone --depth 1 --branch "${{ github.ref_name }}" https://github.com/SosnovichIvan/resume.git "${release_dir}"
            cat > "${config_file}" <<'EOF'
            DOMAIN=sosnovich-ivan.ru
            ACME_EMAIL=isosnovich@yandex.ru
            REPOSITORY_URL=https://github.com/SosnovichIvan/resume.git
            EOF
            DEPLOY_CONFIG="${config_file}" DEPLOY_REF="${{ github.ref_name }}" bash "${release_dir}/deploy.sh"
